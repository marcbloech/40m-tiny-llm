[project]
name = "tiny-llm"
version = "0.1.0"
description = "A 40M-parameter decoder-only transformer LLM trained from scratch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Marc Bloechlinger", email = "hidden" },
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "transformers>=4.36",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ipykernel>=7.2.0",
    "datasets>=2.16",
    "datasketch>=1.6",
    "fast-langdetect>=1.0",
    "gradio>=4.0",
    "matplotlib>=3.10.8",
    "torchinfo>=1.8",
]

[project.optional-dependencies]
eval = ["datasets>=2.16", "lm-eval>=0.4"]
dev = ["ruff", "pytest"]
notebook = ["datasets>=2.16", "matplotlib>=3.7", "seaborn>=0.13", "pandas>=2.0"]
all = ["tiny-llm[eval,dev,notebook]"]

[project.urls]
Repository = "https://github.com/marcbloech/40m-tiny-llm"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
